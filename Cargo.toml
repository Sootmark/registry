[package]
name = "sootmark-registry"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Windows registry hive (regf) parser: keys, values, big data, subkey indexes; ShimCache, UserAssist, ShellBags and shell items."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/registry"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "registry", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "registry"

[dev-dependencies]
# The digests of the recorded dumps.
common = { package = "sootmark-common", version = "0.3.4" }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
